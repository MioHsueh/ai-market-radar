
name: Daily Market Radar

on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-market-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "streamlit>=1.40" "psycopg[binary]>=3.2,<4.0" requests

      - name: Check database configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          value = os.getenv("DATABASE_URL", "")
          parsed = urlsplit(value)

          print("DATABASE_URL exists:", bool(value))
          print("PostgreSQL URL:", parsed.scheme in ("postgresql", "postgres"))
          print("Hostname exists:", bool(parsed.hostname))
          print("Database path exists:", bool(parsed.path and parsed.path != "/"))
          print("Contains literal DATABASE_URL:", "DATABASE_URL" in value)
          PY

      - name: Fetch news and build daily report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python -m jobs.daily_pipeline
